# Weekly dependency updates, per the security posture in CLAUDE.md: keep
# dependencies minimal and Dependabot-patched. Minor and patch bumps arrive
# grouped as one PR to keep the noise down; majors arrive alone.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # The toolchain majors are pinned on purpose: TypeScript 7 (the in-development
    # native port) breaks the build, ESLint 10 outruns eslint-config-next's peer
    # range, and @types/node tracks the Node 24 runtime, not the latest release.
    # Ignore their major bumps so they stop reopening; minor and patch still flow.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
